[package]
name = "flyctrl-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# 本 crate 是飞控核心逻辑：单位系统、状态机、估计算法、控制律。
# 设计为 no_std 友好（不依赖 std/alloc），可在 host 与嵌入式固件间共享。
[dependencies]
libm = "0.2"

# 真实芯片依赖（仅在启用 stm32f407 特性时编译进固件，host/SIL 不受影响）。
# 走原始 PAC + cortex-m 裸机运行时，与 joc-base 直接寄存器访问风格一致，零堆、no_std。
stm32f4 = { version = "0.16", features = ["stm32f407"], optional = true }
cortex-m = { version = "0.7", optional = true }
cortex-m-rt = { version = "0.7", optional = true }

[features]
# 启用具体芯片实现（HAL 的 stm32f407 真实寄存器级驱动）。host/SIL 默认关闭。
stm32f407 = ["dep:stm32f4", "dep:cortex-m", "dep:cortex-m-rt"]
