[workspace]
resolver = "2"
members = [
    "core",
    "sim",
    "bin",
]
# `fw` 是裸机固件（thumbv7em-none-eabihf），单独 `cd fw && cargo build --target ...` 构建。
# 不列入默认成员：避免 feature 统一把 `stm32f407` 灌进 host 的 `flyctrl-core` 构建，
# 否则 cortex-m-rt 被链接进 sitl 出现 `undefined reference to UsageFault/SVCall/...`。
exclude = [
    "fw",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["flyctrl"]
license = "MIT OR Apache-2.0"

# 核心控制逻辑禁用标准库与堆分配：硬实时、可移植到 no_std 飞控固件。
# host 仿真时仍通过 std 运行，但 core crate 自身不依赖 std/alloc。
[workspace.dependencies]
num-traits = "0.2"
nalgebra = { version = "0.32", default-features = false }
heapless = "0.8"
